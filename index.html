<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="A personal AI chat app." />
  <link rel="manifest" href="/manifest.json" />
  <title>My AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">✦</span><span>My AI</span></div>
      <button id="newChat" class="new-chat">＋ New chat</button>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-bottom">
        <button id="themeBtn" class="side-btn">☀️ Toggle theme</button>
        <button id="clearBtn" class="side-btn danger">Clear chats</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
        <div class="mobile-title">My AI</div>
        <div class="model-badge">Free model</div>
      </header>

      <section id="messages" class="messages">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">✦</div>
          <h1>How can I help?</h1>
          <p>Your personal AI chat. Ask questions, explore ideas, or work through code.</p>
          <div class="suggestions">
            <button>Explain something to me simply</button>
            <button>Help me build a website</button>
            <button>Teach me a difficult topic</button>
          </div>
        </div>
      </section>

      <form id="chatForm" class="composer">
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="Message My AI..." autocomplete="off"></textarea>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">➤</button>
        </div>
        <div class="hint">My AI uses a free model through OpenRouter. Don't send passwords or secret API keys.</div>
      </form>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
